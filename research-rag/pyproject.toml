[project]
name = "research-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhengdiao111", email = "81383738+zhengdiao111@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lancedb>=0.39.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "watchdog>=6.0.0",
]

[project.scripts]
research-rag = "research_rag:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
